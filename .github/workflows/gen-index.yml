name: gen-index
on:
  push:
    branches: [gh-pages]
    paths-ignore:
      - 'index.html'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-index
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: regenerate index.html
        run: python3 gen.py

      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "ci: regenerate index"
            git push
          else
            echo "no changes"
          fi
